# pytest 설정 — **`pyproject.toml` 이 아니라 여기 둔다.**
#
# 2026-08-24, Vercel 배포가 이 한 줄에서 멈췄다(C 실측)::
#
#     Failed to run "uv lock --python /vercel/path0/.vercel/python/.venv/bin/python"
#     error: No `project` table found in: /vercel/path0/pyproject.toml
#
# Vercel 파이썬 빌더는 `pyproject.toml` 이 있으면 **PEP 621 프로젝트로 보고 `uv lock`
# 을 돌린다.** 우리 파일에는 `[tool.pytest.ini_options]` 뿐이고 `[project]` 가 없어서
# 거부됐다.
#
# ⚠ `[project]` 를 추가하는 쪽으로 고치지 않았다. 그러면 `dependencies` 를 거기에도
#   적게 되고 **의존성 선언이 두 곳**이 된다 — `requirements.txt` 하나만 보는
#   `test_dependency_bounds`(축 A·B)와 `test_lockfile`(CI 설치 경로)이 그 두 번째
#   목록을 못 본다. 상한이 한쪽에만 붙어도 아무도 모르는 상태가 된다.
#
#   pytest 설정을 여기로 옮기면 Vercel 은 `requirements.txt` 로 떨어지고,
#   의존성 정본은 계속 하나다.
[pytest]
pythonpath = .
testpaths = tests
