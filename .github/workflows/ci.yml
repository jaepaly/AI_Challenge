name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 테스트 (전 워크스페이스)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # packages/engine 골든 테스트 + apps/web TR_ID 가드 테스트를 모두 돌린다.
      # 가드 테스트가 통째로 사라지면 vitest가 "no tests found"로 실패하므로,
      # 가드 제거 자체도 여기서 걸린다.
      - run: npm test

  build:
    name: 빌드 (전 워크스페이스)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: 린트 (전 워크스페이스)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 테스트가 못 잡는 종류를 잡는다. 실제로 react-hooks/refs 규칙이
      # "재생 중에도 7월 재현 버튼이 활성으로 보이던" 동작 버그를 찾아냈다
      # (ref를 렌더에서 읽어 disabled가 갱신되지 않던 문제, PR #14에서 수정).
      - run: npm run lint

  python:
    name: 테스트 (Python 인제스트)
    runs-on: ubuntu-latest
    # services/ingest의 테스트는 #38 시점까지 CI에서 한 번도 돌지 않았다.
    # 위 세 잡이 Node 워크스페이스만 보기 때문이다 — 파싱·근거 좌표·스키마
    # 검증이 전부 로컬 통과에만 의존하고 있었다.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # ⚠ **배포본과 같은 버전이어야 한다.** Vercel 파이썬 런타임이 지원하는 것은
          #   3.12(기본)·3.13·3.14 뿐이고 **3.11 은 없다**. 3.11 로 테스트하고 3.12 로
          #   배포하면 "선언과 실행이 갈라진" 상태가 된다 — 이 저장소가 오늘만 세 번
          #   겪은 종류다(jsdom 30, pytest 8.4, pypdf 6.16.2).
          #   services/ingest/.python-version 이 같은 값을 들고 있고,
          #   test_deployable 이 둘이 어긋나면 넘어진다.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ingest/requirements.txt
            services/ingest/requirements-dev.txt
      # requirements.txt는 런타임 의존만 담는 파일이라 pytest가 없다. 러너는
      # requirements-dev.txt가 얹고, 그 파일이 `-r requirements.txt`로 런타임을
      # 함께 끌어온다 — 설치 집합은 같고 pytest에만 상한이 붙는다.
      #
      # ⚠ 전에는 `... requirements.txt pytest`로 **맨 pytest**를 깔았다. 그러면
      #   requirements-dev.txt의 `pytest>=9.1,<10`이 어느 설치 경로에도 적용되지
      #   않는다 — 선언은 만족하니 상한 가드도 발화하지 않는다. 지키는 것처럼
      #   보이는 검사만 하나 늘어난 상태였다(#71 리뷰, A). pytest 10이 뜨는 날
      #   우리 코드 0줄 변경으로 CI가 깨진다 — #61과 같은 모양이다.
      #
      # 락파일(requirements.lock.txt)은 **일부러 안 쓴다.** 락으로 깔면 상류가
      # 깨지는 것을 영영 모른다. 심사 기간 동결만 락으로 한다.
      # test_lockfile.py가 이 두 규약을 함께 지킨다.
      - run: pip install -r services/ingest/requirements-dev.txt
      # ⚠ 리포 루트에서 돌리는 것이 의도다. `cd services/ingest` 후 돌리면
      # pyproject.toml의 `pythonpath = ["."]`가 사라져도 통과한다 —
      # #26 이전에는 루트에서 `ModuleNotFoundError: No module named 'app'`로
      # 3개 모듈이 수집조차 안 됐다. 그 회귀를 여기서 잡는다.
      #
      # 시크릿은 필요 없다. ANTHROPIC_API_KEY를 참조하는 유일한 테스트
      # (test_raw_pdf_comparison.py)는 키가 요청 페이로드에 새지 않는지
      # 검사하는 쪽이라 키 부재가 정상 경로다.
      #
      # data/terms의 원문 바이트에 의존하는 평탄화 테스트가 있다. 그 파일들은
      # .gitattributes의 `-text`로 개행 정규화가 막혀 있어(#27) Linux 러너도
      # 같은 바이트를 받는다. 그 규칙이 풀리면 이 잡이 먼저 깨진다.
      - run: python -m pytest services/ingest -q
