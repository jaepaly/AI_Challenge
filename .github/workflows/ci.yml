name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 테스트 (전 워크스페이스)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # packages/engine 골든 테스트 + apps/web TR_ID 가드 테스트를 모두 돌린다.
      # 가드 테스트가 통째로 사라지면 vitest가 "no tests found"로 실패하므로,
      # 가드 제거 자체도 여기서 걸린다.
      - run: npm test

  build:
    name: 빌드 (전 워크스페이스)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: 린트 (전 워크스페이스)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 테스트가 못 잡는 종류를 잡는다. 실제로 react-hooks/refs 규칙이
      # "재생 중에도 7월 재현 버튼이 활성으로 보이던" 동작 버그를 찾아냈다
      # (ref를 렌더에서 읽어 disabled가 갱신되지 않던 문제, PR #14에서 수정).
      - run: npm run lint
