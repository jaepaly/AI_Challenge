## 배포 — 🟡 **백업 경로다.** 주 경로는 Vercel Git 연동이다 (C·D)
##
## 🔴 **2026-08-26 이전 이 자리에 «왜 Git 연동이 아닌가» 가 적혀 있었다. 걷어냈다.**
##
##   그 설명의 근거는 둘이었고 **둘 다 사라졌다**::
##
##       Hobby 라 좌석을 못 산다(1인당 월 $20)     ->  Pro 재활성화 (2026-08-26)
##       비공개 저장소 커밋 작성자 검사에 걸린다      ->  팀 초대 수락으로 통과
##
##   지금은 `marginguard-web`·`marginguard-ingest` 둘 다 저장소에 붙어 있고 main
##   푸시마다 Vercel 이 배포한다. **이 워크플로는 `workflow_dispatch` 로만 돈다**
##   (`on:` 참조). 남겨 두는 이유는 Git 연동이 다시 막히는 날 손으로 돌릴 길이
##   있어야 해서다 — Pro 도 커밋 작성자가 팀 멤버일 것을 요구하고, 실제로 팀원이
##   초대를 수락하기 전 커밋이 `Blocked` 났다.
##
##   ⚠ **근거가 사라진 지시를 남겨 두지 마라.** 이 파일 아래쪽 인제스트 절이 정확히
##     그 상태였고, 그 지시를 따르던 사람이 `uv lock`(#85)·`Blocked`(#69)로 두 번
##     멈췄다. 되돌리려면 **Vercel 쪽 연동을 먼저 끊어라** — 순서가 반대면 같은
##     커밋을 두 번 배포한다.
##
## 필요한 Secret 3개 (이 백업 경로를 손으로 쓸 때만)
##   VERCEL_TOKEN       Vercel → Account Settings → Tokens
##   VERCEL_ORG_ID      Vercel 팀 Settings → General 의 Team ID
##   VERCEL_PROJECT_ID  marginguard-web 프로젝트 Settings → General 의 Project ID
##                      (기존 프로젝트여야 URL이 유지된다 — 새로 만들면 제출 URL이 바뀐다)
##
## Secret이 아직 없으면 조용히 건너뛴다. 배포 설정 전에 머지해도 CI가 빨개지지 않는다.
##
## 🔴 **2026-08-26 — 이 워크플로는 이제 «백업»이다. 자동으로 안 돈다.**
##
##   Hobby 무료 우회가 실패로 끝나 **Pro 를 재활성화하고 Git 연동을 붙였다.** 그래서
##   main 푸시의 배포는 **Vercel Git 연동이 한다.** 이 워크플로가 같이 켜져 있으면
##   같은 커밋을 두 번 배포한다.
##
##   ⚠ 그리고 그건 **예정된 사고였다.** GitHub Actions 한도가 **8/31 에 초기화**되므로,
##     `on: push` 를 그대로 뒀으면 그날 자동으로 되살아나 이중 배포가 시작된다. 아무도
##     그날을 지켜보고 있지 않다.
##
##   남겨 두는 이유는 **Git 연동이 다시 막힐 수 있어서**다. Pro 도 *"커밋 작성자가 팀
##   멤버여야 한다"* 를 요구하고, 실제로 팀원이 초대를 수락하기 전 커밋이 `Blocked` 났다.
##   그때 손으로 돌릴 길이 있어야 한다 — `workflow_dispatch`.
##
##   되돌리려면(Git 연동을 끊고 이 경로로 돌아가려면) `on:` 에 `push` 를 되살리고
##   **Vercel 프로젝트의 Git 연동을 먼저 끊어라.** 순서가 반대면 이중 배포가 난다.
##
## 🔴 **`--prebuilt` 를 쓰지 않는다 — 2026-08-24 실측으로 기각됐다.**
##
##   C 가 손으로 그 경로를 완주했다. Git 연동을 끊고, `.git` 없는 폴더에서
##   `vercel build --prod` → `vercel deploy --prebuilt --prod` 를 돌렸다.
##   **커밋 작성자 검사는 통과했고**(Ready + 프로덕션 alias 승격) 화면도 떴다.
##   그런데 서버리스 함수가 전부 500 이었다::
##
##       ChunkLoadError / MODULE_NOT_FOUND
##       Cannot find module '/var/task/apps/web/.next/server/chunks/
##                           [root-of-the-server]__13dzfwx._.js'
##
##   빠진 chunk 를 넣고 재배포해도 같았다. 모노레포라 Next 가 파일 추적 루트를
##   **저장소 루트**로 잡는데(람다 경로가 `apps/web/.next/...` 인 것이 그 증거),
##   로컬 `vercel build` 가 추적한 것과 Vercel 실행 환경이 기대하는 것이 어긋난다.
##
##   그래서 **소스를 올리고 Vercel 이 빌드하게 한다**(`--prebuilt` 없는 `deploy`).
##   그 경로는 Git 연동이 쓰던 것과 같은 빌드이고, 지금 프로덕션에 떠 있던
##   `d218501` 이 그렇게 만들어진 것이라 **동작이 확인된 유일한 경로**다.
##
##   ⚠ 대신 빌드가 Vercel 에서 돌므로 러너 환경변수가 안 닿는다 —
##     `--build-env` 로 `VERCEL_GIT_COMMIT_SHA/REF` 를 명시적으로 넘겨야 한다.
##     안 넘기면 푸터가 `local · dev` 로 뜨고 「신선도 검증」이 대조할 SHA 가 없다.
name: 배포

## 🔴 **`pull_request` 를 뺐다 — 2026-08-24 사고의 전량이 거기서 나왔다.**
##
##   PR 마다 프리뷰 배포가 돌았는데, Vercel Git 연동 때문에 배포가 Blocked 라
##   `vercel` CLI 가 **오지 않을 완료를 무한정 기다렸다.** 잡에 timeout-minutes 가
##   없어 기본 6시간까지 매달렸고, 하루에 8건이 300분 넘게 돌아 합계 2,954분을
##   태웠다. GitHub Actions 무료 한도(private 월 2,000분)가 소진돼 **CI 전체가
##   멈췄다**::
##
##       The job was not started because recent account payments have failed
##       or your spending limit needs to be increased.
##
##   ⚠ **프리뷰 URL 을 우리는 쓰지 않는다.** `INGEST_BASE_URL` 도 프로덕션만 쓰고,
##     프리뷰는 Deployment Protection 때문에 열어도 SSO 로 막힌다. PR 의 빌드 검증은
##     `ci.yml` 의 빌드·테스트 잡이 이미 한다 — 프리뷰 배포가 더해 주던 것은
##     *"Vercel 이 이 산출물을 받아 주는가"* 하나였고, 그건 main 배포에서 확인된다.
##
##   손으로 돌려 볼 일이 있으면 `workflow_dispatch` 로 브랜치를 골라 돌린다.
on:
  ## 🔴 **`push` 도 뺐다 (2026-08-26).** Git 연동이 주 경로가 됐다 — 아래 참조.
  workflow_dispatch:

concurrency:
  # 배포는 중간에 끊지 않는다 — 반쯤 올라간 상태가 제일 나쁘다
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel 배포
    # ⚠ **반드시 있어야 한다.** 없으면 GitHub 기본값 6시간이고, `vercel` CLI 가
    #   완료되지 않는 배포를 기다리면 그 6시간을 전부 태운다(2026-08-24). 배포는
    #   정상이면 몇 분이다 — 넘으면 매달린 것이므로 끊는 편이 맞다.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # CLI는 ORG_ID·PROJECT_ID를 **둘 다** 요구한다(하나만 주면 즉시 거부).
      # 한쪽만 넘겨보는 시도는 실측으로 기각됐다.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROD_URL: https://marginguard-web.vercel.app
    steps:
      # secrets 컨텍스트는 job 레벨 if에서 못 읽는다. 스텝에서 판정해 내려보낸다.
      - name: Secret 유무 판정
        id: pre
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### 배포 건너뜀 — Vercel Secret 미설정" >> "$GITHUB_STEP_SUMMARY"
            echo "VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID 를 등록하면 동작합니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.pre.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.pre.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      # Git 연동 경로가 아니므로 Vercel이 VERCEL_GIT_* 를 자동 주입하지 않는다.
      # 넣지 않으면 푸터·/api/build 가 "local"로 뜬다(배포 신원을 잃는다).
      #
      # ⚠ **여기에 넣는 것만으로는 부족하다.** 빌드가 Vercel 쪽에서 돌기 때문에 러너의
      #   환경변수가 그 빌드에 닿지 않는다. 배포 명령에 `--build-env` 로 다시 넘긴다.
      #   2026-08-24 C 가 손으로 배포했을 때 정확히 이걸 빠뜨려 푸터가 `local · dev` 로
      #   떴다 — 그러면 아래 「신선도 검증」이 대조할 SHA 자체가 없다.
      - name: 빌드 신원 주입
        if: steps.pre.outputs.ready == 'true'
        run: |
          echo "VERCEL_GIT_COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "VERCEL_GIT_COMMIT_REF=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" >> "$GITHUB_ENV"

      - name: Vercel CLI 설치
        if: steps.pre.outputs.ready == 'true'
        run: npm i -g vercel@latest

      # 토큰이 실제로 무엇을 볼 수 있는지 남긴다. "Could not retrieve Project Settings"는
      # 원인이 여럿이라(토큰 범위 / ORG_ID·PROJECT_ID 불일치 / 만료) 출력 없이는 추측만 하게 된다.
      #
      # ⚠ whoami·teams ls로 진단하지 말 것. Vercel 토큰은 Full Account / Team / Project
      #   세 범위가 있고 **project 범위는 user·team 레벨 요청을 거부한다**. 정상 토큰인데도
      #   whoami가 "User not found"를 뱉어서, 실제로 이걸 무효로 오진한 적이 있다.
      #   /v9/projects는 세 범위 모두에서 동작한다(project 범위면 그 하나만 돌아온다).
      - name: Vercel 연결 진단
        if: steps.pre.outputs.ready == 'true'
        run: |
          CODE=$(curl -s -o /tmp/p.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?limit=20" || echo 000)
          {
            echo "## Vercel 연결 진단"
            echo "- HTTP \`$CODE\` (401/403이면 토큰 무효·만료, 200이면 유효)"
            if [ "$CODE" = "200" ]; then
              echo "- 토큰이 보는 프로젝트: \`$(jq -r '[.projects[].name]|join(", ")' /tmp/p.json)\`"
              echo "- 기대 프로젝트 \`marginguard-web\` 포함 여부: **$(jq -r 'if any(.projects[]; .name=="marginguard-web") then "예" else "아니오 — 토큰 범위가 다른 프로젝트/팀이다" end' /tmp/p.json)**"
            else
              echo '```'; jq -r '.error.message // .' /tmp/p.json 2>/dev/null || cat /tmp/p.json; echo '```'
            fi
            A=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN"               "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" || echo 000)
            B=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN"               "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID" || echo 000)
            echo "- 프로젝트 조회: teamId 없이 \`$A\` / teamId 붙여서 \`$B\`"
            echo "  (앞이 200이고 뒤가 4xx면 teamId를 넘기는 것이 원인이다)"
            T=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN"               "https://api.vercel.com/v2/teams/$VERCEL_TEAM_ID" || echo 000)
            echo "- **팀 레벨 조회: \`$T\`** — CLI는 ORG_ID로 팀을 먼저 해석한다."
            echo "  4xx면 토큰이 **project 범위**라는 뜻이고, 해결책은 **team 범위 토큰**이다"
            echo "  (토큰 생성 시 Scope → 팀 선택 → 개별 프로젝트 말고 **All Projects**)."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 프로덕션 배포
        id: prod
        if: steps.pre.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --token="$VERCEL_TOKEN" \
            --build-env VERCEL_GIT_COMMIT_SHA="$VERCEL_GIT_COMMIT_SHA" \
            --build-env VERCEL_GIT_COMMIT_REF="$VERCEL_GIT_COMMIT_REF"

      - name: 프리뷰 배포
        id: preview
        if: steps.pre.outputs.ready == 'true' && github.ref != 'refs/heads/main'
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --token="$VERCEL_TOKEN" \
            --build-env VERCEL_GIT_COMMIT_SHA="$VERCEL_GIT_COMMIT_SHA" \
            --build-env VERCEL_GIT_COMMIT_REF="$VERCEL_GIT_COMMIT_REF")
          echo "### 프리뷰 배포" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      # 배포했다고 끝이 아니다. #14 때는 배포는 됐는데 URL이 옛 커밋을 서빙했다.
      # 상태코드는 그때도 200이었다 — 살아 있는 것과 올바른 것은 다르다.
      - name: 신선도 검증 (프로덕션)
        if: steps.pre.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: |
          sleep 15
          CODE=$(curl -s -o /tmp/b.json -w '%{http_code}' "$PROD_URL/api/build" || echo 000)
          if [ "$CODE" = "404" ]; then
            echo "::notice::/api/build 없음 — PR #18 미머지 상태로 보인다. 검증을 건너뛴다."
            exit 0
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::/api/build 응답 $CODE — 배포 URL이 정상이 아니다"
            exit 1
          fi
          GOT=$(jq -r .sha /tmp/b.json)
          echo "배포된 SHA=$GOT / 기대=$GITHUB_SHA"
          if [ "$GOT" != "$GITHUB_SHA" ]; then
            echo "::error::URL이 아직 옛 커밋을 서빙한다(alias 미승격 의심)"
            exit 1
          fi
          echo "### 배포 확인 — \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

  # ── 인제스트(FastAPI) ──────────────────────────────────────────────
  #
  # 🟢 **2026-08-26 — 이 잡도 «백업» 이다. 주 경로는 Vercel Git 연동이다.**
  #
  #   웹과 같다. `marginguard-ingest` 프로젝트에 저장소를 붙여 두었고 main 푸시마다
  #   Vercel 이 배포한다. 이 잡은 `workflow_dispatch` 로만 돈다.
  #
  #   ⚠ **아래에 «CLI 로 만들어라» 고 적혀 있던 지시를 걷어냈다.** 그 지시의 근거는
  #     두 가지였는데 **둘 다 2026-08-26 에 사라졌다**::
  #
  #         Hobby 라 좌석을 못 산다              ->  Pro 재활성화
  #         비공개 저장소 커밋 작성자 검사에 걸린다  ->  팀 초대 수락으로 통과
  #
  #     근거가 사라진 지시를 남겨 두면 다음 사람이 그대로 따라 하다 헤맨다. 실제로
  #     이 머리글 때문에 인제스트만 CLI 로 가려다 `uv lock`(#85)·`Blocked`(#69) 로
  #     두 번 멈췄다.
  #
  # ## 대시보드 설정 — **두 프로젝트가 서로 다르다**
  #
  #     marginguard-web       Root Directory  apps/web
  #                           바깥 파일 포함    ✅ 켠다
  #     marginguard-ingest    Root Directory  services/ingest
  #                           바깥 파일 포함    ❌ 끈다
  #
  #   🔴 **같은 토글이 두 프로젝트에서 반대 의미다.** 헷갈리기 쉬운 자리라 이유를 적는다.
  #
  #     웹은 `@marginguard/engine` 을 워크스페이스로 의존하고, 그 패키지는 빌드 산출물
  #     없이 **생 TS 소스**를 노출한다(`main: "src/index.ts"`). 저장소 루트가 없으면
  #     빌드가 엔진을 못 찾는다.
  #
  #     인제스트는 정반대다. `two_pass.py` 의 `schema_path()` 가 *"정본이 보이면 정본,
  #     안 보이면 사본"* 인데, **저장소 루트가 안 들어오는 것이 그 설계의 전제**다.
  #     켜면 정본이 보여서 **번들 사본 경로가 프로덕션에서 한 번도 안 쓰인다** —
  #     `scripts/sync_bundled_schema.py` 와 `test_bundled_schema_matches_canonical`
  #     이 지켜 온 장치가 통째로 헛돈다. 그러면 사본이 낡아도 아무도 모르고, 켜기를
  #     되돌리는 날 프로덕션에서만 4중 방어 ②가 터진다.
  #
  # ## 필요한 환경변수 (Vercel 대시보드, Production)
  #
  #     marginguard-ingest    ANTHROPIC_API_KEY     없으면 /ingest 가 500
  #     marginguard-web       INGEST_BASE_URL       없으면 /api/ingest 가 503
  #                                                 (503 은 «업로드 미연결» 을 말하는
  #                                                  정상 응답이다 — 500 과 다르다)
  #
  #   ⚠ `ANTHROPIC_INGEST_MODEL` 은 넣지 않는다. 기본값 `claude-sonnet-5` 가 우리가
  #     실측한 모델이고(docs/team-handbook.md §6-2), 바꾸면 비용 상한 실행기의 정가와도 갈린다.
  #
  # ## 이 백업 경로를 손으로 쓰려면 — Secret 1개
  #
  #     VERCEL_INGEST_PROJECT_ID   Vercel 프로젝트 Settings → General 의 Project ID
  #
  #   없으면 조용히 건너뛴다. 웹 배포는 영향을 받지 않는다.
  #
  # ⚠ **Git 연동과 이 잡을 «동시에» 자동으로 돌리지 마라.** 지금은 이 파일 전체가
  #   `workflow_dispatch` 뿐이라 그럴 일이 없다(`on:` 참조). 되돌리려면 Vercel 쪽
  #   연동을 먼저 끊어라 — 순서가 반대면 같은 커밋을 두 번 배포한다.
  deploy-ingest:
    name: Vercel 배포 (인제스트)
    # ⚠ **반드시 있어야 한다.** 없으면 GitHub 기본값 6시간이고, `vercel` CLI 가
    #   완료되지 않는 배포를 기다리면 그 6시간을 전부 태운다(2026-08-24). 배포는
    #   정상이면 몇 분이다 — 넘으면 매달린 것이므로 끊는 편이 맞다.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_INGEST_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Secret 유무 판정
        id: pre
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### 인제스트 배포 건너뜀 — VERCEL_INGEST_PROJECT_ID 미설정" >> "$GITHUB_STEP_SUMMARY"
            echo "업로드 기능은 붙기 전까지 503 + 대안 문장으로 동작합니다(의도된 상태)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.pre.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.pre.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Vercel CLI 설치
        if: steps.pre.outputs.ready == 'true'
        run: npm i -g vercel@latest

      # ⚠ working-directory 가 이 잡의 규약이다. 최초 링크도 같은 디렉터리에서 한다.
      #   repo 루트에서 돌리면 Vercel 프로젝트의 Root Directory 설정에 의존하게 되고,
      #   그 설정은 저장소에 없어서 어긋나도 아무도 모른다.
      - name: 프로덕션 배포
        if: steps.pre.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        working-directory: services/ingest
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --token="$VERCEL_TOKEN"

      - name: 프리뷰 배포
        if: steps.pre.outputs.ready == 'true' && github.ref != 'refs/heads/main'
        working-directory: services/ingest
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --token="$VERCEL_TOKEN")
          echo "### 인제스트 프리뷰" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      # 배포됐다고 도는 것이 아니다. `/health` 는 키가 없어도 200 이어야 한다 —
      # 키 검사는 `POST /ingest` 가 처음 불릴 때 일어난다(main.py:151).
      # 여기서 200 이 아니면 함수가 아예 안 뜬 것이다(의존성·진입점·시간 한도).
      - name: 살아 있는지 확인
        if: steps.pre.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        working-directory: services/ingest
        run: |
          sleep 10
          URL=$(vercel inspect --token="$VERCEL_TOKEN" 2>/dev/null | grep -oE 'https://[^ ]+\.vercel\.app' | head -1)
          if [ -z "$URL" ]; then
            echo "::notice::배포 URL 을 못 읽었다 — 수동 확인 필요"
            exit 0
          fi
          CODE=$(curl -s -o /tmp/h.json -w '%{http_code}' "$URL/health" || echo 000)
          echo "인제스트 $URL/health → $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::인제스트 /health 가 $CODE 다. 함수가 안 떴을 수 있다."
            exit 1
          fi
          echo "### 인제스트 배포 확인 — \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
